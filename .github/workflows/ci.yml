name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov=nexum --cov-report=xml --cov-fail-under=85
      - name: Smoke the demo seed + CLI
        env:
          NEXUM_DATABASE_URL: sqlite:///./ci-demo.db
        run: |
          uv run nexum init-db
          uv run nexum seed
          uv run nexum automations list
          uv run nexum automations fire daily-cover

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nexum:ci .
      - name: Container boots and answers /healthz
        run: |
          docker run -d --name nexum -p 8000:8000 -e NEXUM_SECRET_KEY=ci-secret nexum:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs nexum
          exit 1
