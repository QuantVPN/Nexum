# Developer convenience for the `alembic` CLI; the app uses `nexum db ...` which builds the
# same configuration programmatically (see nexum/migrations/__init__.py).
[alembic]
script_location = src/nexum/migrations
prepend_sys_path = src
path_separator = os
# Leave empty: the URL comes from NEXUM_DATABASE_URL via nexum.config
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
