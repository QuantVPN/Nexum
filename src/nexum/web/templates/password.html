{% extends "base.html" %}
{% block content %}
<div class="login-box">
  <h1>Change password</h1>
  <p class="muted">Changing your password signs out every other device.</p>
  <form method="post" action="/me/password" class="stack">{{ csrf_input }}
    <label>Current password <input type="password" name="current_password" required autofocus></label>
    <label>New password <input type="password" name="new_password" minlength="8" required></label>
    <label>Repeat new password <input type="password" name="new_password_confirm" minlength="8" required></label>
    <button class="btn btn-primary">Change password</button>
  </form>
</div>
{% endblock %}
